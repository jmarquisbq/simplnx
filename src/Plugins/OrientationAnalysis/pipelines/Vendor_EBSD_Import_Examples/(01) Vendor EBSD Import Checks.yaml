  "mcp": {
    "user_intents": [
      "Import a vendor EBSD map with traceable quality checks",
      "Choose a phase-valid mask without borrowing another format error convention",
      "Add unsupported scalar HDF5 columns before sample rotation"
    ],
    "questions_to_ask": [
      "Which vendor format and scan does the source actually contain?",
      "Is XY spacing measured, and what are the acquisition/sample frame conventions?",
      "Which quality criterion is justified for the next analysis, separate from indexing status?"
    ],
    "constraints": [
      "The maps are different measured specimens. Keep them separate; their quality metrics and indexed fractions do not rank instruments or materials.",
      "Bruker file tuple order differs from the complete beam-coordinate raster at 11146 records. The native BeamOrderDifference/OutOfRasterOrder arrays and OrderingSummary expose this failed spatial prerequisite (#1804). Quality summaries remain order-invariant. Do not segment grains, compute neighborhoods or trust a native image preview until all associated fields are consistently reordered or the importer rejects unsupported order.",
      "The Bruker figure scatters native MAD/mask values at native X BEAM/Y BEAM coordinates. It does not show the uncorrected native ImageGeometry raster or repair that geometry. The 600-column audit constant belongs only to this source header.",
      "Bruker Section_435 has XSTEP=YSTEP=0 and zero X SAMPLE/Y SAMPLE fields. The importer falls back to1-micrometer XY metadata; use pixel indices only until independent calibration is supplied. This task does not establish Bruker sample/crystal frame corrections.",
      "Bruker original phi1/PHI/phi2 are degrees; degrees_to_radians=true creates EulerAngles radians. All other imported scalar fields retain original values. No pattern array is present in this sample.",
      "Oxford scan1 is25x25 with4-micrometer XY spacing. Euler is already radians; Phase is widened from UInt8 to Int32. Cubic phase needs no hexagonal alignment; set that option false. Import Pattern Data is unsupported and off.",
      "Oxford Pattern Quality is imported through ReadHDF5Dataset before sample rotation, using tuple shape[1,25,25] and scalar component shape[1]. The large Processed Patterns stack remains unread.",
      "SourceTupleIndex0..624 is generated before the Oxford180-degreeY sample rotation. All fields including supplementary quality follow the same permutation. Original X/Y acquisition columns are not the corrected geometry coordinates.",
      "Both masks are UInt8 0/1 from Phase>0. On this Oxford file Error=1 at all587 indexed points and Error=2 at38 phase-zero points; Error=0 selects none. Do not generalize these codes to CTF or other vendors.",
      "Native summaries measure all-mask count/sum/mean and selected quality min/max/mean/population standard deviation. Summing the0/1 mask counts indexed points for multiphase data; summing phase IDs does not.",
      "Quality acceptance is not inferred from Phase>0. MAD, Band Contrast and Pattern Quality retain distinct vendor meanings and scales. No additional threshold is imposed.",
      "Z spacing1 is a single-slice placeholder for both maps, not measured thickness. Do not derive volume or calibrated Bruker grain dimensions.",
      "The pipeline JSON is authoritative. Raw source installation requires later dataset/pipeline and redistribution approval."
    ]
  },
