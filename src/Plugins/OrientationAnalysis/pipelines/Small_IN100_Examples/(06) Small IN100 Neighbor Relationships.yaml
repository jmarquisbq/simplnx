    "questions_to_ask": [
      "Does your input have final FeatureIds indexed by the feature matrix?",
      "What are the voxel spacing and physical length units?",
      "Will you exclude unused rows using NumElements>0?",
      "Does the study require face contact, a fixed physical distance, or a radius based on each feature size?",
      "Is row zero reserved, and which positive rows are unused?",
      "How will compact spatial rows be mapped back to original feature IDs?"
    ],
    "constraints": [
      "This pipeline is configured for SmallIN100. Review input requirements and contact rules before adapting it.",
      "Run Archive, Feature Preparation, and Feature Measurements first.",
      "Use final FeatureIds, not twin ParentIds, for this graph.",
      "Include only occupied positive-ID rows in scientific distributions; the CSV retains unused positive rows.",
      "Shared area is in squared geometry length units and has reciprocal directed entries.",
      "After correcting spacing or units, rerun neighbor computation and list statistics for physical areas; stored areas do not update automatically. Rerun feature measurements when physical sizes, centroids, or shapes are needed. Labels and topology can remain unchanged only when the correction changes geometry metadata without changing cell assignments.",
      "Unique shared area between positive feature IDs excludes background and exterior faces. Halve directed totals only for the complete positive-positive graph; do not halve a single feature total or an arbitrary subset with missing endpoints.",
      "GeometrySurfaceFeatures marks the image box only; background-adjacent contact uses a different rule.",
      "The publication provides context, not a numerical oracle for this example.",
      "Use one writable CLI working folder; native GUI working-folder behavior remains unverified.",
      "SpatialFeatures contains reserved row zero plus occupied features only. Create OriginalFeatureId before removing unused positive rows.",
      "The uint8 removal mask is (NumElements == 0) AND (OriginalFeatureId > 0); keep reserved row zero.",
      "Spatial list endpoints and spatial CSV Feature_ID values are compact row indices. Use OriginalFeatureId to join to the original contact graph or cell labels.",
      "The fixed radius is 5 micrometers, or 20 voxel edges for this fixture, and is illustrative rather than calibrated.",
      "The own-diameter mode uses radius_i = EquivalentDiameters[i] * 1.0, not half the diameter or a population-average radius. Its relationships can be asymmetric.",
      "Both spatial modes use inclusive Euclidean distance, exclude self and reserved row zero, and need not produce sorted lists.",
      "Proximity does not require face contact. Finite-domain edge effects are not corrected and periodic wrapping is disabled.",
      "Discard temporary vertex geometries after copying the compact table under the original micrometer image. The removal filter does not preserve vertex-geometry units.",
      "Recompute feature measurements and both spatial searches after physical coordinate, spacing, or unit changes."
    ],
