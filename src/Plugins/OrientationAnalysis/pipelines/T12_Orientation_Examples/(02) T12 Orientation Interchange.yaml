      "Discrete mode uses a 256-pixel stereographic disk and 1-pixel markers; overlapping markers hide multiplicity. Save Count Images is enabled and MRD normalization disabled. Lambert size and color count are inactive for this mode.",
      "Count totals include both antipodes: 6N, 12N and 8N for cubic 001, 011 and 111 families. For N=3059, expect 18354, 36708 and 24472; these are not grain counts, ODF values or MRD.",
