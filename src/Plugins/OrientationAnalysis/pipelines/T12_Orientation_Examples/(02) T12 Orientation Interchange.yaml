      "Convert Orientations To Rodrigues Geometry currently emits stereographic quaternion coordinates q_vector/(1+w), not Rodrigues q_vector/w. FZ conversion chooses crystal-symmetry representatives; no specimen positions or length scales are created.",
      "Both point clouds copy SourceFeatureId_2, FeaturePhases_2, NumElements_2 and OriginalToIdentity_AxisAngleDeg. Row zero is valid source feature 1, not background. Compare source IDs across the two clouds.",
