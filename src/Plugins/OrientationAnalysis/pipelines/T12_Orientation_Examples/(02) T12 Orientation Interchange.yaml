      "Preserve the existing corrected sample frame, original arrays, geometry, phases, validity mask, and feature labels.",
      "All three conversion filters process all cells without a mask; finite values at excluded pixels do not become valid measurements.",
      "Angle conversion is in place; copy first. The round trip includes float32 rounding.",
      "Component reorder alone preserves meaning only when the consumer changes its declared order with the data; it does not normalize, rotate, or apply crystal symmetry.",
      "Conjugation requires XYZW input here. It produces [-x,-y,-z,w], the inverse only for unit quaternions; do not feed Quats_WXYZ to this filter or call this a frame correction.",
      "The exporter reads original Euler radians and converts them to degrees. Do not give it the degree copy with convert_to_degrees=true; false labels the output radians.",
      "The export base name gains _Phase_1 for this dataset. Use spaces (delimiter_index=2).",
