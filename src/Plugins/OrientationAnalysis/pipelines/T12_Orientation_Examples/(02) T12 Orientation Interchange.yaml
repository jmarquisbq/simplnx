      "This workflow writes angle records only. It computes no ODF and performs no StatsGenerator run or synthetic microstructure generation.",
      "The angle file lacks complete phase and crystal-symmetry metadata; configure and validate the downstream StatsGenerator phase separately.",
      "The .d3dpipeline is executable authority. GUI, OOC, generated Python, and downstream import require separate validation.",
      "The grain branch uses rows 1 through 3059 of this specific 3060-row preparation checkpoint. Apply identical split_dimension=0 counts [[1],[3059]] to all five arrays; never reuse those counts blindly after segmentation changes.",
      "Suffix _1 contains background, suffix _2 contains all occupied positive grains. Compact row zero is source feature 1; SourceFeatureId_2 preserves the mapping. WriteASCIIData includes compact row zero.",
      "All positive grains must be phase 1 and cubic-high in this dataset. ComputeFeaturePhases skips feature 0; any mixed-phase warning for a positive grain needs investigation. ComputeMisorientations has no implemented mask parameter.",
      "This representation exercise retains smaller-than-four-pixel grains. It does not change ReportableFeatures or claim the article reporting population.",
      "Crystal fundamental-zone reduction chooses a symmetry-equivalent orientation, unlike conjugation. It does not correct a specimen frame.",
      "FZQuats_XYZW remains scalar-last. RodriguesVector is dimensionless [qx/qw,qy/qw,qz/qw], while RodriguesAxisMagnitude is [unit axis x,y,z,|r|]. Never normalize the combined three-vector or interpret magnitude as angle.",
      "RodriguesConvertor divides by vector norm, so zero vectors need separate handling; qv/w is singular at a 180-degree rotation. Require finite nonzero input without changing measurements to hide singularities.",
      "ComputeMisorientations reads Euler radians and phase symmetry. Its four output components are axis x,y,z and angle in degrees. Axis is not meaningful at near-zero angle.",
      "Both reference comparisons use identity axis-angle [0,0,1,0 degrees]. The saved angle is not grain spread, strain, loading direction, or Euclidean distance in Rodrigues space.",
