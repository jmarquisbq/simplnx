    "questions_to_ask": [
      "What acquisition/export reference-frame settings were used, and were any corrections already applied?",
      "Does the scan use a square grid and radians, and which quality criteria fit the new acquisition?",
      "What are the measured section pitch and low-to-high or high-to-low physical order?",
      "Are all required raw sections present?"
    ],
    "constraints": [
      "The .d3dpipeline is executable authority. Run it from a writable folder containing Data/Small_IN100 and Data/Output.",
      "This is an extension of the existing archive executable, not a second competing archive example. All eight later legacy pipelines remain unchanged.",
      "ReadAngData remaps phase values below 1 to 1; do not use Phases > 0 as a validity mask. The IQ/CI thresholds are inherited SmallIN100 choices, not universal calibrated quality criteria.",
      "EulerAngles_Acquisition retains source orientation values but is spatially reordered by the sample rotation with every other cell array. It is not an unrotated raster.",
      "Rotate Euler Reference Frame modifies orientation values in place; Rotate Sample Reference Frame rearranges cell arrays and geometry. The 90 degree Z and 180 degree Y corrections match the existing EDAX preset for this dataset, not every ANG export.",
      "Imported X Position and Y Position are acquisition-coordinate attributes, not recomputed corrected geometry coordinates.",
      "The inspection has one layer with 1 micrometer placeholder Z spacing. Use it as a 2D map, not for volume, grain-size or thickness measurements. The archive independently records the established 0.25 micrometer section pitch.",
      "The archive reads the raw files again and stores rotation metadata; it does not archive the corrected in-memory inspection arrays. Read H5EBSD with recommended transforms applies those corrections later. Do not apply them a second time.",
      "The archive keeps reference_frame_index=0, stacking_order_index=1, z_spacing=0.25, and the original 1 through 117 generated file list. Verify all of these before adapting.",
      "One acceptable scan does not establish quality, alignment or completeness of all 117 scans. This pipeline does not pause for inspection before archiving.",
      "The completed H5EBSD is read by a later pipeline. Do not add a read of the generated file inside this pipeline: a fresh preflight needs that file before execution can create it.",
      "IPF color is a crystal-direction code for corrected sample Z, not a scalar misorientation, strain, grain or phase map. Black denotes the rejected mask.",
      "Direct ANG inspection and completed-archive readback agree in orientation matrices and reflected cell-array values, not geometry origins. The checked direct origin is [-47.25,0,-1] micrometers with Z spacing 1; readback origin is approximately [0,0,-0.00000413] micrometers with Z spacing 0.25. Inspect or explicitly align coordinates before overlaying; do not silently reset the origin to claim spatial equivalence.",
      "Physical phase 1 and crystal symmetry agree between readers. MaterialName formatting differs: direct import trims Nickel, while archive readback retains a trailing space; reserved phase-zero names also differ. Use phase IDs and symmetry with appropriate string trimming rather than strict raw name equality."
    ],
