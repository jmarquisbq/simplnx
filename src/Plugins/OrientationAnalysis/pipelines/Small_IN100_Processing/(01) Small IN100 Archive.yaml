    "known_differences": "Illustrative raw-import and archival inspection extension to the existing SmallIN100 workflow. It performs no reconstruction or paper-result reproduction. The direct scan has a placeholder Z thickness; the full archive stores measured 0.25 micrometer section pitch. One scan does not establish quality for all 117 sections. Direct inspection and archive readback agree in orientation and cell-array values but have different geometry origins and material-name formatting; this is not a spatial-overlay equivalence claim.",
