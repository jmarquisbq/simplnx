      "After cropping, delete full-map Pattern and both geometries' unpopulated X Position/Y Position arrays. Import still reads the full pattern array.",
      "The .d3dpipeline is executable authority.",
      "The reader creates X Position/Y Position arrays but leaves them zero for this input. This pipeline removes these misleading placeholders from both geometries. Recover zero-based acquisition-grid x=SourceScanIndex%186, y=SourceScanIndex//186. The original HDF5 X Position/Y Position values are separate source metadata, not CSV columns or detector coordinates."
