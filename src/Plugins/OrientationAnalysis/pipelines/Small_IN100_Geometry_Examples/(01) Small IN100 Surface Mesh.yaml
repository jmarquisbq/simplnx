  "last_verified": "2026-10-13",
  "verification_status": "Windows in-memory Release: Geometry and dependent grain-surface CTests passed. All 58 mesh checks passed, including original-data preservation, independent QuickMesh voxel-face ownership/counts/areas, and M3C triangle arithmetic and label/plane invariants. M3C case tables and global manifoldness were not independently validated.",
  "mcp": {
    "user_intents": [
      "Mesh a bounded Small IN100 region and relate internal faces to full-grain misorientation, two-sided IPF colors, assumed-load slip compatibility, and Sigma3 orientation candidates.",
      "Compare current M3C and explicitly legacy QuickMesh with the preserved unsmoothed SurfaceNets reference"
    ],
    "questions_to_ask": [
      "Which label array represents the intended features?",
      "Is the crop and its artificial exterior acceptable?",
      "What length scale and coordinate frame does the consumer require?",
      "Is the intended orientation representative a full cleaned grain or only the crop fragment?",
      "Is FCC nickel slip geometry appropriate, and what specimen-frame loading direction should be assumed?",
      "What independent boundary-plane evidence supports a coherence claim?"
    ],
    "constraints": [
      "Use FeatureIds, not twin ParentIds.",
      "Preserve original FeatureIds without renumbering; compute BoundaryFeaturePhases and BoundaryAvgQuats/BoundaryAvgEulerAngles on the full cleaned volume before cropping. No full-volume shape statistics are imported.",
      "Do not call the combined interface network a closed manifold or solver-ready volume mesh.",
      "Smoothing distance is a per-coordinate cell-space bound, not a physical or radial distance.",
      "Published meshes explicitly use Micrometer units (index 6), matching the source ImageGeom; when adapting input units, change CreateGeometryFilter length_unit_index consistently without silently rescaling coordinates.",
      "STL loses labels, NodeTypes, and explicit unit semantics.",
      "Do not claim exact 2014 reproduction or minimum-area diagonal selection in the current SurfaceNets implementation.",
      "Boundary orientation arrays describe full cleaned child features. ParentIds are a separate twin-grouping namespace.",
      "Require both FaceLabels components > 0 for internal-interface summaries. Caps give NaN misorientation, zero strength metrics, false Sigma3 flags, and a black exterior IPF side.",
      "Face IPF arrays correspond to label components 0/1; cubic centrosymmetry makes positive and negative normal directions equivalent. Normals are dimensionless and do not prove physical boundary-plane accuracy.",
      "Loading [0,0,1] is an illustrative specimen-Z direction. FCC {111}<110> geometric descriptors are not measured strength and are not generic BCC slip metrics.",
      "Strength components correspond to label0 to label1 and label1 to label0; F1spt uses slip-plane-normal alignment rather than physical boundary traces.",
      "Sigma3Candidate uses angle tolerance 2 degrees and axis tolerance 3 degrees. Find Coherence is false; no twin-plane or coherent-twin conclusion.",
      "New crystallography belongs only to original SurfaceMesh. Smoothing and transformation variants do not inherit it; recompute any geometry-dependent interpretation in a consistent frame.",
      "M3C and legacy QuickMesh read the same unchanged cropped FeatureIds, retain caps, and transfer no source data arrays.",
      "QuickMesh is deprecated and appears only for compatibility comparison. Keep fix_problem_voxels=false so input labels remain unchanged.",
      "M3C uses parameter version3 with sharp_bounding_box_edges=true; older chamfered output is not the geometry demonstrated here.",
      "Every added mesh is reconstructed with explicit Micrometer units, then receives fresh areas and normals.",
      "Only original SurfaceMesh carries boundary crystallography. Do not copy per-face arrays between different tessellations or infer triangle-index correspondence.",
      "M3C topology and pair areas need not equal voxel-face topology. Triangle counts, surface appearance and area differences are not accuracy or quality rankings.",
      "No guarantee of watertight global network, globally outward normals, solver suitability or self-intersection freedom."
    ],
