  "last_verified": "2026-10-13",
  "verification_status": "Windows in-memory Release: four-pipeline CTest chain passed 1/1 in 23.21 s. All 51 original interchange checks passed, with the expected column set extended only for ImageQuality64 and GridCellIndex. All 27 additional checks passed: 18 original datasets preserved, original CSV byte-identical, float64 copy exact, calibrated grid geometry, every source index/count/mean checked against independent binning and a 210-by-170 weight matrix. Direct means agree exactly; maximum Gaussian mean error is 1.2457437037483032e-7. The new preview uses these hash-identified native arrays and was visually inspected. OOC, generated Python, GUI, and installed-app execution are unverified.",
  "mcp": {
    "user_intents": [
      "Assemble complementary point-table rows from HDF5 and export named coordinate columns without losing identity.",
      "Compare direct point occupancy with scalar interpolation while retaining the original point identities."
    ],
    "questions_to_ask": [
      "What dataset paths, numeric types, tuple/component shapes, axis order, and coordinate units does the source declare?",
      "Do all scalar arrays share the same row identity and tile order?",
      "Is the goal a full NX structure import or selected numeric HDF5 interchange?",
      "Which output cells must contain measured points, and may estimates extend into cells without observations?",
      "What physical grid spacing and kernel support fit the measurement resolution and intended interpretation?"
    ],
    "constraints": [
      "Run stage 03 before preflighting stage 04; its HDF5 file must exist.",
      "Use ReadDREAM3D for a full NX structure import; this example deliberately extracts selected numeric datasets.",
      "TileA has 89 tuples and TileB has 81; append A then B consistently for all four arrays. No sorting or deduplication is performed.",
      "Coordinates are float32 with three XYZ components; SourceROICellIndex and FeatureIds remain int32 scalars, and Image Quality remains float32 scalar metadata.",
      "Tuple dimensions and component dimensions describe the source layout; changing them is not a transpose.",
      "SourceROICellIndex is an X-fastest flat index into the cropped 24-cubed ROI, not a global acquisition ID.",
      "Both tiles derive from the same measured grain 2205; Image Quality is inherited metadata, not calibrated confidence.",
      "Disable normalization; create geometry with explicitly checked Micrometer units (index 6), not units inferred from numeric coordinates.",
      "Export every point tuple, including row zero, with headers only and the six declared columns.",
      "Retain original float32 Image Quality and integer identity fields. Convert only an interpolation copy to float64; do not average source IDs or FeatureIds.",
      "Both image geometries use Micrometer units, dimensions [5,7,6], origin [24,25,14], and spacing [0.5,0.5,0.5].",
      "MapPointCloudToRegularGrid records containing-cell indices for inspection and errors on out-of-bounds points. InterpolatePointCloudToRegularGrid v4 recomputes indices and does not consume GridCellIndex.",
      "Uniform kernel size [0.25,0.25,0.25] micrometers is below the spacing and affects only each point's containing cell. Gaussian size [1,1,1] micrometers gives integer radius [1,1,1].",
      "Gaussian sigmas [1,1,1] are measured in integer grid-cell offsets: one cell offset is 0.5 micrometers here. Weights do not use exact point-to-cell-center distances.",
      "The main interpolated output is sum(weight*value)/sum(weight). Length is an unweighted contribution count, not the sum of weights; all other optional statistics are disabled.",
      "Empty cells contain zero values and zero counts. Use contribution counts to distinguish them from measured or interpolated zero values.",
      "Gaussian-only cells are estimates outside observed occupancy. The comparison does not establish new measured coverage, grain geometry, calibrated confidence, or independent survey reconstruction.",
      "Arrays to Copy is intentionally empty because it also averages values over kernel support; it does not preserve categorical identities.",
      "The explicit float64 copy supports older snapshots with an interpolation output-type mismatch. Builds containing merged simplnx PR 1763 promote interpolated outputs themselves; float64 source input is not a universal requirement."
    ],
