    "constraints": [
      "Read stage 01 directly; stage 02 measurements are optional.",
      "ReferenceCloud contains 170 image-cell centers, not 256 surface-mesh vertices.",
      "SourceROICellIndex is a flat index in the cropped 24-cubed image, not a global acquisition ID.",
      "Tiles and MovingChallenge derive from the same reference; do not describe them as independent measured scans.",
      "Image Quality is inherited reconstruction metadata; it is not a calibrated score or an ICP weight.",
      "Preserve Micrometer units and independent vertex arrays for all retained clouds. The unit-propagation workaround addresses https://github.com/BlueQuartzSoftware/simplnx/issues/1784.",
      "The tiles are complementary partitions: 89 plus 81 equals 170 unique points. No duplicate identification or removal is performed or claimed.",
      "Overlapping-tile deduplication is excluded because the current duplicate filter can miss identical coordinates on tied grid planes. Tracked at https://github.com/BlueQuartzSoftware/simplnx/issues/1783.",
      "Origin alignment matches coordinate-wise minima; ICP is local and needs a sufficiently close starting pose.",
      "ICPResidualTransform excludes the earlier coarse translation; compose residual, coarse translation, and known transform for recovery checks."
