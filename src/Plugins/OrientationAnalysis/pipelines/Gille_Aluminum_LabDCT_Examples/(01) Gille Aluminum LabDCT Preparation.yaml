    "constraints": [
      "Keep source grain IDs and their cell association unchanged. This is a published crop of an already reconstructed/prepared map, not raw diffraction data.",
      "Read LabDCT=true and AbsorptionCT=false. The original file is 567,693,056 bytes, mostly an unused CT volume; no ACT/DCT alignment or loading sequence is processed.",
      "Geometry units are Millimeter with spacing [0.004,0.004,0.004]. Origin is Center - Extent/2 + VirtualShift, approximately [0.19552725,-0.34209903,3.68725684] mm. Do not substitute micron numbers without changing both scale and unit metadata.",
      "Compatible orientation conversion changes source Rodrigues r to [-r/|r|,|r|]; source vectors must be finite and nonzero for this current reader. Convert that four-component array to NX Euler radians. Do not conjugate twice or add CTF/ANG frame rotations.",
      "Compatible IPFColor conversion is off because this source has only IPF001 and the current importer wrongly requires missing color directions (#1805). Preserve IPF001 float, explicitly scale it to UInt8, and compute a separate NX_IPF001_RGB with color key 0, TSL. Source and NX legends are not interchangeable.",
      "ValidGrainVoxels combines supplied Mask > 0, PhaseId > 0 and GrainId > 0; all 1,650,000 cells pass. No completeness threshold or grain relabeling is added.",
      "Grain Data row 0 is unused. Rows 1..1666 preserve original grain IDs. Feature CSV excludes row 0 and writes 1,666 feature records with Feature_ID.",
      "ObservedVolume_mm3 and ObservedEquivalentDiameter_mm describe only retained voxels. AtCropBoundary flags 931 grains touching the crop, not physical free surfaces. Do not report these as full-grain sizes.",
      "Below27Voxels flags only grain 1049, 23 voxels,AtCropBoundary=1. The catalogue minimum 27 claim does not match this file; cropping can truncate grains, but its exact historical cause is not established. No corrective deletion/filling is applied.",
      "Completeness is a supplied reconstruction-quality field, not strain or a probability. Grouped means use Float32 accumulation; the independent Float64 comparison differed by at most 2.08e-6 in this run.",
      "No Laguerre tessellation, quadratic tetrahedral meshing, projection-DIC, Z-set model calibration, loading boundary conditions or CP-FE/fracture prediction is implemented. Follow the cited external workflow and obtain the necessary additional data to reproduce those steps.",
      "The public crop has dense grain labels and no void labels; it does not establish absence of pores or intermetallic particles in the real alloy. Source dataset licensing is CC BY 4.0; raw packaging remains subject to project approval.",
      "ValidGrainVoxels controls IPF colors and completeness statistics; ComputeFeatureSizes and feature-phase assignment use all retained GrainId labels. All source voxels pass here. Resolve invalid labels and mixed-phase grains explicitly when adapting; do not assume the mask applies to every downstream filter.",
      "WriteLosAlamosFFTFilter consumes Float32 Euler radians and converts to degree text internally, rounding to three decimal places. Supplying degrees would convert twice. The eight fields are Phi1_deg,Phi_deg,Phi2_deg,X,Y,Z,GrainId,PhaseId,with no header.",
      "FFT grid indices are one-based and X-fastest; physical origin,0.004mm spacing,unit metadata and model/boundary/loading parameters are not in the file. Original grain and phase IDs are copied unchanged.",
      "WriteSPParksSites emits a Values-only file with no Sites or Neighbors section. Use it only with an already defined compatible box/site lattice and matching one-based X-fastest site IDs. The fixed 26-max-neighbors header does not generate or verify adjacency.",
      "SPPARKS site values are original grain IDs,not phase labels or measured orientations. For a Potts application they must fit 1..Q; this fixture uses 1..1666. Model parameters,physics,physical scale,kinetics and boundary conditions must be supplied/validated separately.",
      "Both writers export every voxel and do not use ValidGrainVoxels. All source voxels pass here; establish an explicit invalid-cell policy before adapting to another dataset.",
      "The two export formats serve different modeling tasks. Neither replaces the paper Neper mesh or validates CP-FE/FFT/Potts predictions. Cropped opposite faces are not proven periodic.",
      "Original native arrays and grain CSV remain unchanged. The existing figure retains its original native-source hash because the plotted arrays are bitwise preserved; new artifacts have separate hashes.",
      "FFT one-based grid indices map to native voxel centers by origin + (index - 0.5) * spacing in millimeters. SPPARKS site ID minus one is the zero-based X-fastest linear voxel index; verify target site identity before importing values."
    ]
