    "constraints": [
      "Run cleanup stages 01, 02 and 03, then segmentation stage 01. Segmentation stage 02 is independent.",
      "Use uncalibrated pixel units; connected brightness patches have no grain or material-phase identity.",
      "Pair FaceRegionIds with FaceRegionData and LargeRegionIds with LargeRegionData; numeric IDs are not interchangeable.",
      "Selection classes are int32 0/1 with exactly two summary rows and must be constant within each feature.",
      "CreateFeatureArrayFromElementArray copies a within-feature constant; use ComputeArrayStatistics for varying intensity.",
      "Counts exclude feature row zero. Fractions include all 355216 pixels, with row zero representing the unselected complement.",
      "Selected-area fractions on this one-slice image are not estimates of material volume fractions.",
      "Compute moments only for the retained dense positive IDs in a single XY slice; original singleton regions are unsafe.",
      "Exclude background row zero and check finite moment values before interpreting retained shapes.",
      "Count and area snapshots show a selection effect, not before/after shape evolution.",
      "Scalar segmentation uses exact equality on the 0/1 integer mask without masking: both brightness classes initially receive positive feature IDs.",
      "ComputeFeaturePhasesBinary writes feature-indexed values into the chosen feature-sized AM; each source component must have a uniform mask value because mixed values use last-cell-wins.",
      "Removal and ranking use copies, keep feature row zero reserved, and disable neighbor filling. No measured intensity or original labels are changed.",
      "The 80 percent target divides cumulative ranked PixelCount by all original bright pixels, excludes feature row zero, and includes the whole component crossing the target.",
      "Rank ties use ascending current feature ID; a tie at the cutoff gives an arbitrary choice among equally sized patches. The supplied 80 percent cutoff has no tie.",
      "The area budget is a review choice, not an acceptance threshold, noise diagnosis, phase fraction, or claim that the chosen regions are representative.",
      "Pair TwoClassRegionIds and TwoClassRegionIds_Bright with the matching TwoClassRegionData tables; OriginalComponentId refers to the full two-class partition.",
      "Rank a copy of the prepared FaceRegionIds and FaceRegionData: FaceRegionIds_Area80 pairs with FaceRegionData_Area80, whose SourceFaceRegionId refers to original FaceRegionData, not the two-class partition.",
      "The prepared feature table supplies a known preflight population. Newly generated indexed statistics have zero tuples during preflight and cannot feed the rank filter directly in this pipeline."
    ],
    "user_intents": [
      "Compare how a minimum pixel count changes region number and selected area",
      "Measure retained 2D brightness-patch shapes",
      "Choose a compact set of whole bright patches accounting for a chosen share of selected image area"
    ],
    "questions": [
      "Should small regions be flagged in a report or removed from a new label image?",
      "How much selected area is lost compared with the number of regions?",
      "Which retained patches have contrasting Omega1 and Omega2 values?",
      "How does keeping 80 percent of selected area compare with a fixed minimum patch size?"
    ]
  },
