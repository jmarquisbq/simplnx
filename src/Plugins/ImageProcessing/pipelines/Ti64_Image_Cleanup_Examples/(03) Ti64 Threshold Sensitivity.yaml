    "constraints": [
      "Run preparation and smoothing in order before this pipeline.",
      "Use the same inclusive [0.35, 1.0] rule on all four float32 inputs.",
      "Interpret 0/1 uint8 Mean as selected-pixel fraction and Summation as count.",
      "Treat original as the unfiltered normalized crop, not the 604 by 604 source frame.",
      "Do not infer phase, grain, porosity, or HADMA accuracy from brightness masks.",
      "Read the .d3dpipeline arguments as executable authority.",
      "Robust Automatic Threshold computes one global T = sum(I*G)/sum(G), with float32 accumulation, and selects I >= T. It is not local adaptive thresholding.",
      "Use a finite, nonnegative gradient magnitude from exactly the same image/grid; zero total gradient makes the threshold undefined. The current filter does not reject that case.",
      "The native threshold filter creates a bool mask, but does not save its cutoff. Label any reconstructed threshold as a verification calculation.",
      "Opening and closing modify separate copies of RobustGaussianV1. Each uses one erosion and one dilation, X/Y enabled, Z disabled, and existing face neighbors only.",
      "Morphology ignores out-of-image neighbors, includes no diagonal neighbors, and uses cell layers rather than calibrated physical distances.",
      "New bool summaries save Length and Summation only; divide them for selected fraction. Do not look for a new Mean array.",
      "Lower automatic cutoff and cleaner masks do not establish greater material accuracy or phase identity."
    ],
